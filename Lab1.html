<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        .calculator {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid grey;
            border-radius: 10px;
            background-color: lightgrey;
            text-align: center;
            font-family: Arial;
        }

        .input {
            width: 90%;
            padding: 10px;
            margin: 5px;
        }

        .operator {
            width: 97%;
            padding: 10px;
            margin: 5px;
        }

        .calculate-btn {
            padding: 10px 25px;
            margin: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Simple Calculator</h2>

        <input
            type="number"
            id="num1"
            class="input"
            placeholder="Enter first number"
        >

        <select id="operator" class="operator">
            <option value="+">Addition (+)</option>
            <option value="-">Subtraction (-)</option>
            <option value="*">Multiplication (*)</option>
            <option value="/">Division (/)</option>
        </select>

        <input
            type="number"
            id="num2"
            class="input"
            placeholder="Enter second number"
        >

        <button
            onclick="calculate()"
            class="calculate-btn"
        >
            Calculate
        </button>

        <p id="result"></p>

    </div>

    <script>
        function calculate() {
            let num1 = document.getElementById("num1").value;
            let num2 = document.getElementById("num2").value;
            let operator = document.getElementById("operator").value;
            let result = document.getElementById("result");

            if (num1 === "" || num2 === "") {
                result.innerHTML = "Please enter both numbers.";
                result.style.color = "red";
                return;
            }

            num1 = Number(num1);
            num2 = Number(num2);

            let answer;

            switch (operator) {
                case "+":
                    answer = num1 + num2;
                    break;

                case "-":
                    answer = num1 - num2;
                    break;

                case "*":
                    answer = num1 * num2;
                    break;

                case "/":
                    if (num2 === 0) {
                        result.innerHTML = "Error: Cannot divide by zero.";
                        result.style.color = "red";
                        return;
                    }
                    answer = num1 / num2;
                    break;
            }

            result.innerHTML = "Result: " + answer;
            result.style.color = "green";
        }
    </script>

</body>
</html>
